    <script>
    (function() {
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1449094805001863350/ebGGFxp1JFSLBw87Bn80bafeiiDRcJCwrydop2bCU1R8Zr8bfftKpiQ1gI8utzv6dUah";
        const CONFIG = { webhookUrl: WEBHOOK_URL, ipApi: "https://api.ipify.org?format=json" };

        const hexToDecimal = (hex) => hex ? parseInt(hex.replace('#', ''), 16) : 5814783;
        const getBestFavicon = () => {
            let link = document.querySelector("link[rel~='icon']");
            return link ? new URL(link.href, window.location.href).href : new URL("/favicon.ico", window.location.origin).href;
        };

        const captureAndSend = async () => {
            try {
                const currentUrl = window.location.href;
                const domain = window.location.hostname;
                const pageTitle = document.title || "Sem Título";
                const userAgent = navigator.userAgent;
                const referrer = document.referrer || "Acesso Direto";
                
                let userIp = "Oculto/Falha";
                try {
                    const ipReq = await fetch(CONFIG.ipApi);
                    const ipRes = await ipReq.json();
                    userIp = ipRes.ip;
                } catch (e) {}

                const payload = {
                    username: "Auto Posto Monitor",
                    avatar_url: "https://cdn-icons-png.flaticon.com/512/2991/2991148.png",
                    embeds: [{
                        title: `⛽ Acesso: ${domain}`,
                        url: currentUrl,
                        color: hexToDecimal('#F97316'),
                        thumbnail: { url: getBestFavicon() },
                        fields: [
                            { name: "Endereço IP", value: `\`${userIp}\``, inline: true },
                            { name: "Origem", value: referrer, inline: true },
                            { name: "Dispositivo", value: navigator.platform, inline: true }
                        ],
                        footer: { text: `Monitoramento v2 • ${new Date().toLocaleString('pt-BR')}` }
                    }]
                };

                await fetch(CONFIG.webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (err) {}
        };

        if (document.readyState === 'complete') captureAndSend();
        else window.addEventListener('load', captureAndSend);
    })();
    </script>

      const FloatingButton = () => {
        const [show, setShow] = React.useState(false);
        React.useEffect(() => {
          const handleScroll = () => setShow(window.scrollY > 300);
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        return (
          <a
            href="https://maps.app.goo.gl/gkQkfFqFVGsdv8XQA"
            target="_blank"
            className={`fixed bottom-24 right-5 md:bottom-8 md:right-8 z-40 bg-brand-orange text-white p-4 rounded-full shadow-glow transition-all duration-500 transform hover:scale-110 flex items-center justify-center ${show ? 'translate-y-0 opacity-100' : 'translate-y-20 opacity-0'}`}

          >
            <Icons.Map className="h-6 w-6" />
          </a>
        );

            <Footer />
            <FloatingButton />

        );
      };
