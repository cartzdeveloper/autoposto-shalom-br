      // --- Componente: Cinematic Intro Loader ---
      const Preloader = ({ onComplete }) => {
        const [progress, setProgress] = React.useState(0);
        const [isExiting, setIsExiting] = React.useState(false);
        const [activeWord, setActiveWord] = React.useState(0);

        const words = ["Qualidade.", "Confiança.", "Shalom."];

        React.useEffect(() => {
          // Bloqueia Scroll
          document.body.classList.add('loading-active');

          // Logic para contagem
          const timer = setInterval(() => {
            setProgress((old) => {
              if (old === 100) {
                clearInterval(timer);
                setTimeout(() => {
                   setIsExiting(true);
                   // Aguarda a animação de saída terminar para liberar o app
                   setTimeout(() => {
                     document.body.classList.remove('loading-active');
                     onComplete();
                   }, 1000); 
                }, 500); // Pausa no 100%
                return 100;
              }
              const diff = Math.random() * 10;
              return Math.min(old + diff, 100);
            });
          }, 150);

          // Logic para trocar palavras
          const wordTimer = setInterval(() => {
              setActiveWord(prev => (prev + 1) % words.length);
          }, 900);

          return () => {
             clearInterval(timer);
             clearInterval(wordTimer);
          };
        }, []);

        return (
          <div className={`fixed inset-0 z-[100] bg-brand-dark flex flex-col items-center justify-center loader-curtain ${isExiting ? 'slide-up' : ''}`}>
             
             {/* Fundo Atmosférico */}
             <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-orange/20 rounded-full blur-[100px] pointer-events-none opacity-50 animate-pulse"></div>

                {/* Palavras trocando */}

                      {words[Math.min(Math.floor(progress / 33), 2)]}
                   </span>
                </div>

                {/* Progress Bar Container */}
                <div className="w-full bg-gray-800 h-1 rounded-full overflow-hidden relative">
                   <div 
                      className="h-full bg-brand-orange shadow-[0_0_15px_rgba(249,115,22,0.8)] transition-all duration-200 ease-out"
                      style={{ width: `${progress}%` }}
                   ></div>
                </div>
                
                {/* Percent Counter & Status */}
                <div className="flex justify-between items-end mt-2 text-white/50 font-display font-bold text-xs uppercase tracking-widest">
                   <span>Abastecendo sistema...</span>
                   <span className="text-2xl text-white">{Math.round(progress)}%</span>
                </div>
             </div>
          </div>
        );
      };

      const Location = () => (
         <section id="localizacao" className="bg-white py-24">
             <div className="container mx-auto px-6 flex flex-col md:flex-row gap-12 items-center">

                    <div className="space-y-6">
