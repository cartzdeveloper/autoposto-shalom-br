          <React.Fragment>
            <Preloader loading={loading} />
            
            <div className="min-h-screen w-full flex flex-col items-center justify-center p-4 sm:p-6 pb-12">
              <div className={`w-full max-w-md mx-auto transition-all duration-1000 ease-out delay-500 ${loading ? 'opacity-0 translate-y-10' : 'opacity-100 translate-y-0'}`}>
                  
                  <Header />
                
                  <main className="space-y-6 flex flex-col items-center relative z-10">
                    
                    {/* Highlight Card - WhatsApp Palmeira */}
                    <div className="w-full relative group">
                        <div className="absolute -inset-0.5 bg-gradient-to-r from-brand-pink to-purple-900 rounded-2xl opacity-40 group-hover:opacity-70 blur transition duration-500"></div>
                        <div className="relative bg-[#080808] border border-white/5 rounded-2xl p-4 flex flex-col items-center overflow-hidden">
                            {/* Glass shine effect */}
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white/5 blur-[40px] -translate-y-1/2 translate-x-1/2 rounded-full pointer-events-none"></div>

                            {companyConfig.offerImageUrl && (
                                <div className="w-full mb-4 overflow-hidden rounded-lg border border-white/5 shadow-2xl relative">
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10"></div>
                                    <img 
                                        src={companyConfig.offerImageUrl} 
                                        alt="Destaque" 
                                        className="w-full h-48 object-cover transform group-hover:scale-105 transition-transform duration-1000 ease-out"
                                    />
                                    <div className="absolute bottom-3 left-3 z-20">
                                        <span className="bg-brand-pink/90 text-white text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider backdrop-blur-sm">Promoção</span>
                                    </div>
                                </div>
                            )}
                            <div className="w-full text-center mb-1">
                                <h3 className="font-cinzel text-white text-lg">Faça seu Pedido</h3>
                                <p className="font-inter text-gray-400 text-xs mb-4 font-light">Whatsapp - Palmeira dos Índios</p>
                            </div>
                            <LinkButton 
                                text="Iniciar Atendimento"
                                subtitle="Clique para falar conosco"
                                href={companyConfig.whatsappLinkMain}
                                primary={true}
                                icon={<WhatsappIcon className="w-5 h-5" />}
                            />
                        </div>
                    </div>

                    {/* Elegant Divider */}
                    <div className="w-full flex items-center justify-center py-2 opacity-50">
                       <div className="h-px w-24 bg-gradient-to-r from-transparent via-gray-600 to-transparent"></div>
                       <span className="mx-2 text-[10px] text-gray-600 tracking-widest uppercase">Mais Opções</span>
                       <div className="h-px w-24 bg-gradient-to-r from-transparent via-gray-600 to-transparent"></div>
                    </div>
                    
                    {/* Main Links List */}
                    <div className="w-full space-y-3">
                      {mainLinks.map((link, index) => (
                        <div 
                          key={link.id}
                          className="animate-fade-in"
                          style={{ animationDelay: `${(index + 2) * 150}ms` }}
                        >
                          <LinkButton 
                            text={link.text}
                            subtitle={link.subtitle}
                            href={link.href}
                            primary={link.primary}
                            iconName={link.iconName}
                            onClick={() => handleLinkClick(link.action)}
                          />
                        </div>
                      ))}
                    </div>

                  </main>
              </div>
              
              <AboutModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} />
            </div>
          </React.Fragment>
        );
      };

      // --- Mount the App ---
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
</body>
</html>
